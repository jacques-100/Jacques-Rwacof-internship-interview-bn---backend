# Production stack for ONE small Linux server: MySQL + the API + Caddy (automatic HTTPS certificates).
# Only Caddy is reachable from the internet (ports 80 and 443); the API and database stay on the private network.
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--innodb-buffer-pool-size=256M", "--max-connections=60"]
    environment:
      MYSQL_DATABASE: cherrytrack
      MYSQL_USER: cherrytrack
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/cherrytrack?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
      DB_USERNAME: cherrytrack
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ characters) in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # The browser web app, plus the Android app (which calls from https://localhost).
      CORS_ALLOWED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN in .env},https://localhost
      REFRESH_COOKIE_SECURE: "true"
      SWAGGER_ENABLED: "false"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SEED_DEMO_DATA: "false"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
