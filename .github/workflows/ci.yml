name: Backend CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: cherrytrack_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: maven }
      - name: Build and test (real MySQL, real Flyway migrations)
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/cherrytrack_test?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC
          TEST_DB_USER: root
          TEST_DB_PASSWORD: root
        run: ./mvnw -B verify
      - run: docker build -t cherrytrack-backend .
