spring.application.name=cherrytrack
server.port=${PORT:8080}
server.shutdown=graceful
# Behind a reverse proxy (HTTPS termination) the real client address arrives in X-Forwarded-For. Tomcat only trusts
# it from the proxy's private network, so a client on the internet cannot forge it. The login rate limit relies on this.
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never

# --- Database (credentials come from the environment, never from source control) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cherrytrack?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC}
spring.datasource.username=${DB_USERNAME:cherrytrack}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}

# --- JPA: Flyway owns the schema, Hibernate only validates it ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Uploads (company logo, profile photos): the service enforces tighter per-kind limits ---
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# --- JSON ---
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# --- Business configuration ---
cherrytrack.station.name=${STATION_NAME:Nduba Coffee Washing Station}
cherrytrack.station.timezone=${STATION_TIMEZONE:Africa/Kigali}
cherrytrack.capacity.daily-limit-kg=5000
cherrytrack.capacity.single-delivery-max-kg=500
cherrytrack.capacity.low-threshold-kg=500

# --- Security ---
# JWT_SECRET must be set (>= 32 chars). The app refuses to start without it.
cherrytrack.security.jwt-secret=${JWT_SECRET:}
cherrytrack.security.access-token-minutes=30
cherrytrack.security.refresh-token-days=7
cherrytrack.security.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
cherrytrack.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,https://localhost,capacitor://localhost}
cherrytrack.security.login-max-attempts=5
cherrytrack.security.login-window-seconds=60

# --- Bootstrap / demo data ---
# BOOTSTRAP_ADMIN_PASSWORD creates an 'admin' account when the users table is empty.
cherrytrack.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
# SEED_DEMO_DATA=true loads demo farmers and history when the database is empty.
cherrytrack.seed.enabled=${SEED_DEMO_DATA:false}
cherrytrack.seed.demo-password=${SEED_DEMO_PASSWORD:}

# --- API docs ---
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# --- Observability ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Structured JSON logs: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (done in docker-compose).
logging.pattern.level=%5p [%X{correlationId:-}]
